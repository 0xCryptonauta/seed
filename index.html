<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/seedIB_icon.png" />
    <link rel="apple-touch-icon" href="/seedIB_icon.png" />
    <meta name="theme-color" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seed - Mnemonic</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme:v1") || "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
